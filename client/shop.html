<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop | EcoBag Shop</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header>

        <div class="logo">
            🌿 EcoBag Shop
        </div>


        <nav>

            <a href="index.html">
                Home
            </a>


            <a href="shop.html" class="active">
                Shop
            </a>


            <!-- LOGIN -->

            <a href="login.html" id="loginLink">
                Login
            </a>


            <!-- REGISTER -->

            <a href="register.html" id="registerLink">
                Register
            </a>


            <!-- ACCOUNT AFTER LOGIN -->

            <div id="userMenu" class="user-menu" style="display: none;">

                <button class="account-button" type="button">

                    <i class="fa-solid fa-user"></i>

                    Account

                    <i class="fa-solid fa-chevron-down"></i>

                </button>


                <div class="account-dropdown">

                    <a href="orders.html">

                        <i class="fa-solid fa-box"></i>

                        My Orders

                    </a>


                    <button type="button" onclick="logout()">

                        <i class="fa-solid fa-right-from-bracket"></i>

                        Logout

                    </button>

                </div>

            </div>


            <!-- CART -->

            <a href="cart.html">

                <i class="fa-solid fa-cart-shopping"></i>

            </a>

        </nav>

    </header>



    <!-- ================= SHOP BANNER ================= -->

    <section class="shop-banner">

        <div class="shop-banner-content">

            <span class="shop-eyebrow">
                ECO-FRIENDLY COLLECTION
            </span>

            <h1>
                Sustainable Products
                <br>
                For Everyday Living
            </h1>

            <p>
                Discover thoughtfully designed bags that combine
                sustainability, durability and modern style.
            </p>

        </div>

    </section>


    <!-- ================= SEARCH & FILTER ================= -->

    <section class="search-area">

        <input type="text" id="search" placeholder="Search Product...">


        <select id="filter">

            <option value="all">
                All Categories
            </option>

            <option value="Shopping">
                Shopping
            </option>

            <option value="Gift">
                Gift
            </option>

            <option value="Medical">
                Medical
            </option>

            <option value="Bakery">
                Bakery
            </option>

            <option value="Jute Bags">
                Jute Bags
            </option>

        </select>

    </section>



    <!-- ================= PRODUCTS ================= -->

    <section class="products-section">

        <div id="products" class="product-grid">

            <!-- Products loaded from MongoDB -->

        </div>

    </section>



    <!-- ================= FOOTER ================= -->

    <footer>

        © 2026 EcoBag Shop

    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <!-- Header authentication -->

    <script src="js/header.js"></script>


    <!-- Product loading -->

    <script src="js/shop.js"></script>


</body>

</html>
